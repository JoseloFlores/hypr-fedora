id = "jo/updates-fedora"
name = "Updates Fedora"
version = "1.0.0"
plugin_api = 9
author = "jo"
license = "MIT"
icon = "cloud-download"
description = "Muestra el numero de actualizaciones dnf y flatpak. Al hacer clic abre foot para instalarlas."
tags = ["utility", "fedora", "updates"]
dependencies = ["dnf", "flatpak", "foot"]

[[widget]]
id = "updates"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_count"
  type = "bool"
  label_key = "settings.show_count.label"
  description_key = "settings.show_count.description"
  default = true

[[setting]]
key = "interval_minutes"
type = "int"
label_key = "settings.interval_minutes.label"
description_key = "settings.interval_minutes.description"
default = 30
min = 5
max = 720

[[setting]]
key = "include_flatpak"
type = "bool"
label_key = "settings.include_flatpak.label"
description_key = "settings.include_flatpak.description"
default = true

[[setting]]
key = "notify_on_updates"
type = "bool"
label_key = "settings.notify_on_updates.label"
description_key = "settings.notify_on_updates.description"
default = true

[[setting]]
key = "terminal"
type = "string"
label_key = "settings.terminal.label"
description_key = "settings.terminal.description"
default = "foot"

[[setting]]
key = "auto_yes"
type = "bool"
label_key = "settings.auto_yes.label"
description_key = "settings.auto_yes.description"
default = true
